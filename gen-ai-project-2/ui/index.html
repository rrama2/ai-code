<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Support Assistant</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell"><header><div class="mark">✦</div><div><h1>Support Assistant</h1><p>Answers from our help center · Human support when needed</p></div><span class="status">● Online</span></header><section id="messages" class="messages" aria-live="polite"><article class="bubble bot">Hi! Ask a question about your account, billing, API keys, or data exports. I'll use our help center and escalate requests that need a person.</article></section><form id="chatForm"><label for="message">Your question</label><div class="composer"><textarea id="message" rows="2" maxlength="2000" placeholder="How do I reset my password?" required></textarea><button id="send" type="submit">Send ↗</button></div><small>Do not share passwords, API secrets, or payment card details.</small></form></main><script src="config.js"></script><script src="app.js"></script></body></html>
